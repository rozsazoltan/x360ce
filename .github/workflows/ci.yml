name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: .cache/cargo-target
      CARGO_INCREMENTAL: 1
      CARGO_TERM_COLOR: always
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Source archives and the crates.io index do not depend on compiler output.
      # Restore them before resolving a missing lockfile so Cargo can reuse downloads.
      - name: Restore Cargo registry cache
        id: cargo-registry-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: windows-quality-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'tools/x360ce-dev/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            windows-quality-registry-v1-${{ runner.os }}-

      - name: Ensure Cargo lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "Cargo.lock")) {
              Write-Host "Cargo.lock is not committed; generating it for this workflow run."
              cargo generate-lockfile
          }

      # Compiler artifacts depend on the resolved dependency graph. The lockfile now
      # always exists, including on the initial PR before Cargo.lock is committed.
      - name: Restore Cargo target cache
        id: cargo-target-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: windows-quality-target-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'tools/x360ce-dev/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-quality-target-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'tools/x360ce-dev/Cargo.toml', '.cargo/config.toml') }}-
            windows-quality-target-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            windows-quality-target-v4-${{ runner.os }}-

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy performs Cargo's all-targets type checking. A separate cargo check
      # would compile the same graph again without adding coverage.
      - name: Check all targets with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Save Cargo registry cache
        if: always() && steps.cargo-registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ steps.cargo-registry-cache.outputs.cache-primary-key }}

      # Commit-specific keys allow the next PR commit to restore the newest target
      # directory through restore-keys instead of remaining on the first cache entry.
      - name: Save Cargo target cache
        if: always() && steps.cargo-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.cargo-target-cache.outputs.cache-primary-key }}
